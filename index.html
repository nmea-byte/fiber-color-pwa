<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fiber Tube Viewer 1728</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
}

.tube {
  background: #1e1e1e;
  margin-bottom: 10px;
  border-radius: 8px;
  overflow: hidden;
}

.tube-header {
  padding: 15px;
  cursor: pointer;
  font-weight: bold;
  background: #222;
}

.tube-content {
  display: none;
  padding: 10px;
}

.fiber {
  display: inline-block;
  width: 70px;
  margin: 5px;
  padding: 5px;
  border-radius: 5px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  color: black;
}
</style>
</head>

<body>

<h1>1728 Fiber Tube Viewer</h1>

<div id="tubeContainer"></div>

<script>

const fiberColors = [
  {name:"Blue", color:"#0066ff"},
  {name:"Orange", color:"#ff8000"},
  {name:"Green", color:"#00b300"},
  {name:"Brown", color:"#8b4513"},
  {name:"Slate", color:"#708090"},
  {name:"White", color:"#ffffff"},
  {name:"Red", color:"#ff0000"},
  {name:"Black", color:"#000000"},
  {name:"Yellow", color:"#ffd700"},
  {name:"Violet", color:"#8a2be2"},
  {name:"Rose", color:"#ff66cc"},
  {name:"Aqua", color:"#00ffff"}
];

const totalFibers = 1728;
const fibersPerTube = 12;
const totalTubes = totalFibers / fibersPerTube;

const container = document.getElementById("tubeContainer");

for (let t = 1; t <= totalTubes; t++) {

  const tubeDiv = document.createElement("div");
  tubeDiv.className = "tube";

  const header = document.createElement("div");
  header.className = "tube-header";
  header.innerText = "Tube " + t;
  header.onclick = function() {
    const content = this.nextElementSibling;
    content.style.display = content.style.display === "block" ? "none" : "block";
  };

  const content = document.createElement("div");
  content.className = "tube-content";

  for (let f = 1; f <= fibersPerTube; f++) {
    const fiberNumber = ((t - 1) * fibersPerTube) + f;
    const colorIndex = (f - 1) % 12;

    const fiberDiv = document.createElement("div");
    fiberDiv.className = "fiber";
    fiberDiv.style.background = fiberColors[colorIndex].color;

    if (fiberColors[colorIndex].name === "Black") {
      fiberDiv.style.color = "white";
    }

    fiberDiv.innerHTML = fiberNumber + "<br>" + fiberColors[colorIndex].name;

    content.appendChild(fiberDiv);
  }

  tubeDiv.appendChild(header);
  tubeDiv.appendChild(content);
  container.appendChild(tubeDiv);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
