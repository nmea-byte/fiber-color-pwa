<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fiber Color Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
}

.search-box {
  text-align: center;
  margin-bottom: 20px;
}

input {
  padding: 8px;
  font-size: 16px;
  width: 150px;
  text-align: center;
}

button {
  padding: 8px 15px;
  font-size: 16px;
  cursor: pointer;
}

.tube {
  margin-bottom: 10px;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

.tube-header {
  padding: 15px;
  cursor: pointer;
  font-weight: bold;
  position: relative;
}

.tube-content {
  display: none;
  padding: 10px;
  background: #1e1e1e;
}

.fiber {
  display: inline-block;
  width: 70px;
  margin: 5px;
  padding: 5px;
  border-radius: 5px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  color: black;
}

.rings {
  display: flex;
  flex-direction: column;
  position: absolute;
  right: 10px;
  top: 5px;
}

.ring {
  width: 20px;
  height: 3px;
  margin: 2px 0;
  border-radius: 2px;
  background: black; /* overridden in JS for black tubes */
}
</style>
</head>

<body>

<h1>Fiber Color Chart</h1>

<div class="search-box">
  <p>Search Fiber (1–1728)</p>
  <input type="number" id="fiberSearch" min="1" max="1728">
  <button onclick="searchFiber()">Search</button>
</div>
